# Deployment-relevant fields from the official GraspGenX release generator config.
diffusion:
  object_backbone: ptv3vanilla
  gripper_backbone: sweep_volume_v2
  pointnet_version: v2
  checkpoint_object_encoder_pretrained: null
  num_embed_dim: 256
  num_object_dim: 512
  num_gripper_dim: 512
  diffusion_embed_dim: 512
  image_size: 256
  num_diffusion_iters: 20
  num_diffusion_iters_eval: 20
  compositional_schedular: true
  loss_pointmatching: false
  loss_l1_pos: true
  loss_l1_rot: true
  grasp_repr: r3_so3
  kappa: 3.27
  clip_sample: true
  beta_schedule: squaredcos_cap_v2
  attention: cat_attn
  pose_repr: mlp
  num_grasps_per_object: 100
  ptv3:
    grid_size: 0.01
  ptv3vanilla:
    grid_size: 0.01
    output_dim: 512
    enable_flash: false
